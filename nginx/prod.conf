# ═══════════════════════════════════════════════════════════════
# Sentinel-Link / FlowLens — Nginx Reverse Proxy (Production)
# ═══════════════════════════════════════════════════════════════
# Certbot will inject SSL blocks automatically.
# After deploy: certbot --nginx -d hackathon.lynqcr.com -d analytics.lynqcr.com ...
# ═══════════════════════════════════════════════════════════════

# ── Shared upstream definitions ──────────────────────────────

upstream api_banco_a   { server api_banco_a:8001;  }
upstream api_banco_b   { server api_banco_b:8002;  }
upstream api_banco_c   { server api_banco_c:8004;  }
upstream api_analytics { server api_analytics:8003; }
upstream api_finsta    { server api_finsta:8005;    }
upstream api_safecall  { server api_safecall:8006;  }

upstream ui_banco_a   { server ui_banco_a:5173;  }
upstream ui_banco_b   { server ui_banco_b:5174;  }
upstream ui_banco_c   { server ui_banco_c:5176;  }
upstream ui_analytics { server ui_analytics:5175; }
upstream ui_finsta    { server ui_finsta:5177;    }
upstream ui_safecall  { server ui_safecall:5178;  }

# ── Common proxy headers (reusable via include) ─────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ═════════════════════════════════════════════════════════════
# 1. LANDING PAGE — hackathon.lynqcr.com
# ═════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name hackathon.lynqcr.com;

    root /usr/share/nginx/html/landing;
    index landing.html;

    location / {
        try_files $uri /landing.html;
    }

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ═════════════════════════════════════════════════════════════
# 2. BANCO A — bancoa.lynqcr.com
# ═════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name bancoa.lynqcr.com;

    # API routes → backend
    location ~ ^/(auth|accounts|transactions|interbank|health) {
        proxy_pass         http://api_banco_a;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Everything else → frontend (Vite dev server)
    location / {
        proxy_pass         http://ui_banco_a;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_http_version 1.1;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

