# ═════════════════════════════════════════════════════════════
# 5. ANALYTICS — analytics.lynqcr.com
# ═════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name analytics.lynqcr.com;

    client_max_body_size 10M;

    # API routes → backend
    location ~ ^/(banks|alerts|network|investigations|dashboard|reports|cases|finsta-alerts|health) {
        proxy_pass         http://api_analytics;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Transactions fetch (analytics pulls from banks)
    location /transactions {
        proxy_pass         http://api_analytics;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Accounts follow-up
    location /accounts {
        proxy_pass         http://api_analytics;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SGT Secure Alerts endpoint (from Flutter keyboard)
    location /api/ {
        proxy_pass         http://api_analytics;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Everything else → frontend
    location / {
        proxy_pass         http://ui_analytics;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_http_version 1.1;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

