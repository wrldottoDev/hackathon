# ═════════════════════════════════════════════════════════════
# 7. SAFECALL — safecall.lynqcr.com
# ═════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name safecall.lynqcr.com;

    location /api/ {
        proxy_pass         http://api_safecall;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass         http://api_safecall;
        proxy_set_header   Host $host;
    }

    location / {
        proxy_pass         http://ui_safecall;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_http_version 1.1;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ═════════════════════════════════════════════════════════════
# DEFAULT — catch-all (redirect to landing)
# ═════════════════════════════════════════════════════════════

server {
    listen 80 default_server;
    server_name _;
    return 301 http://hackathon.lynqcr.com$request_uri;
}
