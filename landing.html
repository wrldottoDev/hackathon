/* ═══════════════════════════════════════════
   UTILITY: Intersection Observer for reveals
   ═══════════════════════════════════════════ */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      },
      { threshold: 0.15 }
    );
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, []);
  return ref;
}

    <div ref={ref} className="reveal pillar-card bg-obsidian/60 border border-gunmetal/60 rounded-2xl p-8 relative overflow-hidden"
         style={{ transitionDelay: `${index * 150}ms` }}>
      {/* Top accent line */}

        tagColor === 'blue' ? 'from-transparent via-electric to-transparent' :
