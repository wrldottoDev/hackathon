name: tensorflow_keyboard
description: Flutter scaffold for a custom keyboard with safe native capture boundaries.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  basic_utils: ^5.8.2
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_contacts: ^2.0.2
  flutter_local_notifications: ^21.0.0
  http: ^1.6.0
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.5
  speech_to_text: ^7.3.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/security/
